<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Superadministrador · Wali</title>
<link rel="icon" type="image/png" sizes="32x32" href="__BASE__/img/wali-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Panel de superadministrador (maqueta B «Editorial» aprobada el 31-oct en «Maquetas Wali»): pestañas centradas arriba,
   Resumen, Empresas y Finanzas. Solo datos de uso y de cobros: nunca contactos ni mensajes de las empresas.
   Todo lo que viene del API pasa por esc() antes de pintarse; el logo solo se usa si es un data URL de imagen válido.
   Motion (motion-design): curva principal (.2,0,0,1), entrada (.05,.7,.1,1), salida (.3,0,1,1); 120/240/480 ms;
   la gráfica se dibuja en 900 ms; escalonado de 40 ms. Con «reducir movimiento» todo queda quieto. */
:root{--ink:#0b0b10;--t2:#4b5563;--t3:#6b7280;--line:#e9ebef;--grid:#f0f1f4;--bg:#fff;--amar:#FFD21F;--ok:#15803d;--mal:#b91c1c;
  --e-std:cubic-bezier(.2,0,0,1);--e-in:cubic-bezier(.05,.7,.1,1);--e-out:cubic-bezier(.3,0,1,1);
  --c-starter:#2a78d6;--c-growth:#eb6834;--c-business:#1baf7a;--c-suma:#1baf7a;--c-resta:#e34948}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{height:60px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:0 32px;position:sticky;top:0;z-index:20;background:#fff}
.marca{display:flex;align-items:center;gap:9px;font-weight:700;line-height:1}
.marca img{width:28px;height:28px;border-radius:8px;display:block}
.marca b{font-size:15px;line-height:1}
.tag{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;margin-left:4px;border:1px solid var(--line);border-radius:6px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:var(--t3)}
.tabs{position:relative;display:flex}
.tab{display:inline-flex;align-items:center;gap:7px;height:59px;padding:0 15px;font-size:13.5px;font-weight:500;color:var(--t3);transition:color 120ms var(--e-std)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.ind{position:absolute;bottom:-1px;height:2px;background:var(--ink);border-radius:2px;transition:left 240ms var(--e-std),width 240ms var(--e-std)}
.yo{justify-self:end;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t2)}
.yo button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.yo button:hover{background:#f6f7f9;color:var(--ink)}
main{max-width:1440px;margin:0 auto;padding:30px 40px 70px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.sub{margin:3px 0 0;font-size:13px;color:var(--t3)}
.der{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;white-space:nowrap;transition:background 120ms var(--e-std)}
.btn:hover{background:#f6f7f9}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff}
.seg button{padding:4px 11px;border-radius:7px;font-size:12.5px;color:var(--t2);transition:background 120ms var(--e-std),color 120ms var(--e-std)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.lbl{font-size:12.5px;color:var(--t3)}
.mut{color:var(--t3)}.t2{color:var(--t2)}
.dl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;white-space:nowrap}
.dl.u{color:var(--ok)}.dl.d{color:var(--mal)}.dl.n{color:var(--t3)}
.dl svg{width:13px;height:13px;stroke-width:2.2}
.h3{font-size:14.5px;font-weight:650;margin:0}
.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.big{font-size:28px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.2}
.est{display:inline-flex;align-items:center;justify-content:center;line-height:1;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.est svg{width:12px;height:12px;stroke-width:2.2}
.est.ok{background:#e8f8ee;color:#15803d}.est.w{background:#fff8e1;color:#7a5a00}.est.b{background:#fee2e2;color:#b91c1c}.est.g{background:#f1f5f9;color:#4b5563}.est.p{background:#eef2ff;color:#4338ca}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;font-weight:500;color:var(--t3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.bar{height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;transform-origin:left;transition:transform 480ms var(--e-in) 260ms}
.vacio{padding:36px 16px;text-align:center;color:var(--t3)}
.av{flex:none;display:block}
/* Resumen */
.r-top{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px}
.hero{font-size:52px;font-weight:750;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.r-lado{border-left:1px solid var(--line);padding-left:28px}
.r-k{padding:14px 0;border-bottom:1px solid var(--line)}
.r-k .v{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.r-k .v b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.r-bajo{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:26px}
.fila-at{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.fila-at > div{flex:1;min-width:0}
.graf{position:relative}
.graf svg{display:block;width:100%;overflow:visible}
.cross{position:absolute;top:0;width:0;border-left:1px dashed #9ca3af;pointer-events:none;transition:left 120ms var(--e-std),opacity 120ms var(--e-std)}
.punto{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px #fff;pointer-events:none;transition:left 120ms var(--e-std),top 120ms var(--e-std),opacity 120ms var(--e-std)}
.tip{position:absolute;min-width:150px;padding:8px 12px;border-radius:9px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px -12px rgba(15,23,42,.3);font-size:11.5px;color:var(--t3);pointer-events:none;white-space:nowrap;transition:left 120ms var(--e-std),top 120ms var(--e-std),opacity 120ms var(--e-std)}
.tip b{display:block;font-size:13px;color:var(--ink)}
.tip .tl{display:flex;justify-content:space-between;gap:14px;font-size:11.5px}
.tip .tl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.ley{display:flex;gap:14px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.ley span{display:inline-flex;align-items:center;gap:6px}
.ley i{width:10px;height:10px;border-radius:3px}
/* Empresas */
.kp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kp button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;text-align:left;transition:border-color 120ms var(--e-std),box-shadow 120ms var(--e-std)}
.kp button:hover{border-color:#cbd5e1}
.kp button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.kp b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.busca{display:flex;gap:8px;margin-bottom:14px}
.campo{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--t3);background:#fff}
.campo:focus-within{border-color:var(--ink)}
.campo input{border:0;outline:0;font:inherit;font-size:13.5px;color:var(--ink);flex:1;min-width:0;background:none}
.dd{position:relative}
.dd > .btn{height:40px}
.dd > .btn[aria-expanded="true"]{border-color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 36px -16px rgba(15,23,42,.35);padding:5px;transform-origin:top right;animation:abre 160ms var(--e-in)}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left}
.menu button:hover{background:#f6f7f9}
.menu button[aria-checked="true"]{font-weight:600}
@keyframes abre{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
tbody tr[data-emp]{cursor:pointer;transition:background 120ms var(--e-std)}
tbody tr[data-emp]:hover{background:#fafbfc}
tbody tr[data-emp].on{background:#fffbe0}
tbody tr[data-emp]:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.emp{display:flex;align-items:center;gap:10px}
.emp b{font-weight:600}
.pn{position:fixed;top:60px;right:0;bottom:0;width:min(500px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-30px 0 60px -40px rgba(0,0,0,.45);padding:22px 24px 40px;overflow-y:auto;z-index:18;transform:translateX(100%);transition:transform 240ms var(--e-out)}
.pn.in{transform:none;transition:transform 340ms var(--e-in)}
.pn-h{display:flex;gap:12px;align-items:center}
.pn-h h2{margin:0;font-size:18px;font-weight:650}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#dc2626;margin-left:auto;flex:none}
.x:hover{background:#fef2f2}
.cif{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.cif div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cif b{display:block;font-size:14.5px;margin-top:2px}
.sec{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin:20px 0 4px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f3f4f6;font-size:13px}
.sec + .row{border-top:0}
.row > div{flex:1;min-width:0}
.row > div b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row > div .lbl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Finanzas */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.g2a{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pyg{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pyg.tot{font-weight:700;font-size:15px}
/* Cupones */
.btn.pri{background:var(--amar);border-color:var(--amar);color:#0b0b10;font-weight:600}
.btn.pri:hover{background:#f5c800}
.btn:disabled{opacity:.55;cursor:default}
.cod{display:inline-flex;align-items:center;justify-content:center;line-height:1;height:24px;padding:0 8px;border-radius:6px;background:#f4f5f7;border:1px dashed var(--line);font-size:12.5px;font-weight:600}
.mas{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.mas:hover{background:#f6f7f9}
tr.borrando td{transition:opacity 240ms var(--e-out),padding 240ms var(--e-out);opacity:0;padding-top:0;padding-bottom:0}
.fm{display:grid;gap:16px;margin-top:18px}
.fm label,.fm .lb{display:grid;gap:6px;font-size:12.5px;font-weight:600}
.fm input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;outline:0;transition:border-color 120ms var(--e-std)}
.fm input:focus{border-color:var(--ink)}
.fm small{font-weight:400;color:var(--t3);font-size:12px}
.fm .dd > .btn{width:100%;justify-content:space-between}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.ancho{display:flex;width:100%}.seg.ancho button{flex:1;text-align:center;padding:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:500;transition:background 120ms var(--e-std),color 120ms var(--e-std)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.prev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--t2)}
.err{color:var(--mal);font-size:12.5px;margin:0}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 240ms var(--e-in),transform 240ms var(--e-in);z-index:40}
#toast.ver{opacity:1;transform:translate(-50%,0)}
/* Soporte */
.tab-n{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#e34948;color:#fff;font-size:10.5px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.tab-n[hidden]{display:none}
.s-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.s-tabs button{padding:8px 2px;font-size:13px;font-weight:500;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color 120ms var(--e-std),border-color 240ms var(--e-std)}
.s-tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--ink)}
.s-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
.s-lista{display:grid;gap:2px;align-content:start;max-height:calc(100vh - 200px);overflow-y:auto}
.s-fila{display:flex;gap:10px;padding:12px 14px;border-radius:12px;text-align:left;width:100%;transition:background 120ms var(--e-std)}
.s-fila:hover{background:#f6f7f9}
.s-fila.on{background:#fffbe0;box-shadow:0 0 0 1px var(--amar) inset}
.s-fc{flex:1;min-width:0;display:grid;gap:2px}
.s-f1{display:flex;justify-content:space-between;gap:8px}.s-f1 b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s-f1 .lbl{white-space:nowrap}
.s-f2{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-f3{display:flex;gap:6px;align-items:center;margin-top:3px}.s-nueva{margin-left:auto;font-size:11px}
.s-det{padding:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;overflow:hidden;min-height:520px}
.s-hilo{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.s-hcab{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.s-hcab .btn[aria-pressed="true"]{border-color:var(--ink)}
.s-msjs{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:440px}
.s-msj{max-width:80%;animation:abre 240ms var(--e-in)}.s-msj .lbl{margin-bottom:4px}
.s-b{padding:11px 14px;border-radius:14px 14px 14px 4px;background:#f4f5f7;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.s-msj.yo{align-self:flex-end}.s-msj.yo .lbl{text-align:right}.s-msj.yo .s-b{border-radius:14px 14px 4px 14px;background:#fff8d6;border:1px solid #fde68a}
.s-adj{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--t2)}
.s-pista{border:1px dashed var(--line);border-radius:12px;padding:11px 14px;font-size:12.5px;display:flex;gap:10px;color:var(--t2)}.s-pista b{color:var(--ink)}
.s-resp{padding:12px 16px;border-top:1px solid var(--line)}
.s-resp textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:80px;font:inherit;font-size:13.5px;resize:vertical;outline:0;transition:border-color 120ms var(--e-std)}
.s-resp textarea:focus{border-color:var(--ink)}
.s-rpie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.s-ctx{padding:16px 18px}
.s-cf{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.s-cf > span:first-child{flex:none}.s-cf > span:last-child{text-align:right}
@media (max-width:1100px){.s-grid{grid-template-columns:1fr}.s-det{grid-template-columns:1fr}.s-hilo{border-right:0}}
/* Motion de entrada: cada página arranca con .pre y al quitarla cada pieza llega a su lugar. */
.ent{transition:opacity 240ms var(--e-in) var(--d,0ms),transform 240ms var(--e-in) var(--d,0ms)}
.pre .ent{opacity:0;transform:translateY(10px);transition:none}
.pre .bar b{transform:scaleX(0);transition:none}
.sube{transform-box:fill-box;transform-origin:50% 100%;transition:transform 480ms var(--e-in) calc(var(--d,0ms) + 120ms)}
.pre .sube{transform:scaleY(0);transition:none}
.traza{transition:stroke-dashoffset 900ms var(--e-std) 120ms}
.area{transition:opacity 480ms var(--e-std) 620ms}
.pre .area{opacity:0;transition:none}
@media (max-width:1100px){.r-top{grid-template-columns:1fr}.r-lado{border-left:0;padding-left:0}.g2a,.g2b,.r-bajo{grid-template-columns:1fr}}
@media (max-width:960px){.kp{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:22px 16px 60px}.top{padding:0 16px;grid-template-columns:auto 1fr auto}.tabs{overflow-x:auto;justify-self:center;max-width:100%}.tab{padding:0 10px}.yo span{display:none}.tag{display:none}}
@media (max-width:768px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.busca{flex-wrap:wrap}.campo{flex-basis:100%}.hero{font-size:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="marca"><img src="__BASE__/img/wali-180.png" alt=""><b>wali</b><span class="tag">Superadmin</span></span>
  <nav class="tabs" role="tablist" aria-label="Secciones" id="tabs">
    <button type="button" class="tab" role="tab" data-tab="resumen" aria-selected="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3Z"/></svg>Resumen</button>
    <button type="button" class="tab" role="tab" data-tab="empresas" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1"/></svg>Empresas</button>
    <button type="button" class="tab" role="tab" data-tab="finanzas" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Finanzas</button>
    <button type="button" class="tab" role="tab" data-tab="cupones" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8Z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Cupones</button>
    <button type="button" class="tab" role="tab" data-tab="soporte" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg>Soporte<span class="tab-n" hidden></span></button>

<script>
/*ADMIN_INICIO*/
const INI = window.INICIO || {yo: {}};
const $ = id => document.getElementById(id);

/* ── API ── */
const tk = {v: null, en: 0};
async function token(fresco){
  if (!fresco && tk.v && Date.now() - tk.en < 50 * 60_000) return tk.v;
  const r = await fetch('__BASE__/api/auth/token', {credentials: 'same-origin', cache: 'no-store'});
  if (r.status === 401 || r.status === 403) { location.href = '__BASE__/entrar'; throw new Error('Tu sesión venció'); }
  tk.v = (await r.json()).token; tk.en = Date.now(); return tk.v;
}
async function api(ruta, metodo = 'GET', cuerpo){
  for (let i = 0; i < 2; i++) {
    const r = await fetch('__BASE__/api/admin' + ruta, {method: metodo, cache: 'no-store', headers: {Authorization: 'Bearer ' + await token(i > 0), ...(cuerpo ? {'Content-Type': 'application/json'} : {})}, body: cuerpo ? JSON.stringify(cuerpo) : undefined});
    if (r.status === 401 && i === 0) continue;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || j.message || 'No se pudo completar. Intenta de nuevo.');
    return j.data;
  }
}

/* ── Formatos ── */
const DIA = 86_400_000;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const F = new Intl.DateTimeFormat('es-CO', {day: 'numeric', month: 'short', timeZone: 'America/Bogota'});
const FA = new Intl.DateTimeFormat('es-CO', {day: 'numeric', month: 'short', year: 'numeric', timeZone: 'America/Bogota'});
const FL = new Intl.DateTimeFormat('es-CO', {day: 'numeric', month: 'long', year: 'numeric', timeZone: 'America/Bogota'});
const fecha = d => { if (!d) return ''; const x = new Date(d); return (x.getFullYear() === new Date().getFullYear() ? F : FA).format(x).replace(/\./g, '').replace(/ de /g, ' '); };
const num = n => new Intl.NumberFormat('es-CO', {maximumFractionDigits: 0}).format(n || 0);
const usd = (c, dec) => { const v = (c || 0) / 100, d = dec ?? (Math.abs(v) < 1000 && v % 1 ? 2 : 0); return 'US$ ' + new Intl.NumberFormat('es-CO', {minimumFractionDigits: d, maximumFractionDigits: d}).format(v); };
const pct = (x, d = 0) => x == null ? '—' : new Intl.NumberFormat('es-CO', {maximumFractionDigits: d, minimumFractionDigits: d}).format(x * 100) + ' %';
function hace(d){
  if (!d) return 'Nunca';
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 1) return 'Ahora'; if (m < 60) return `Hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `Hace ${h} h`;
  const dd = Math.round(h / 24); return dd === 1 ? 'Ayer' : dd < 30 ? `Hace ${dd} días` : fecha(d);
}
const mesDe = (iso) => { const d = new Date(new Date(iso).getTime() - 5 * 3600_000); return [d.getUTCFullYear(), d.getUTCMonth()]; };
const mesCorto = (iso) => MESES[mesDe(iso)[1]].slice(0, 3);
const mesLargo = (clave) => { const [y, m] = clave.split('-').map(Number); return `${MESES[m - 1][0].toUpperCase()}${MESES[m - 1].slice(1)} ${y}`; };
const IC = {
  up: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  dn: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 9v8H9"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>',
  dl: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  cal: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  dots: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  link: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  reloj: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  chulo: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  correo: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  avion: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',

  tel: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>',
};
/** Un cambio con su flecha: sube (verde) o baja (rojo); `malo` invierte el color (p. ej. la cancelación). */
function cambio(actual, antes, como, malo){
  if (antes == null || actual == null) return '<span class="dl n">—</span>';
  const dif = actual - antes; if (!dif) return '<span class="dl n">Sin cambio</span>';

}
const PLAN = {starter: 'Starter', growth: 'Growth', business: 'Business'};
const ROL = {ADMIN: 'Administrador', LIDER: 'Líder', AGENTE: 'Agente', LECTOR: 'Solo lectura'};

const ESTADO = {prueba: ['Prueba', 'p'], activo: ['Activo', 'ok'], 'pago-pendiente': ['Pago pendiente', 'w'], cancelado: ['Cancelado', 'b'], vencido: ['Vencido', 'b'], interno: ['Interno', 'g']};
const estado = e => e.cancelaAlFinal && e.estado === 'activo' ? ['Cancela al final', 'w'] : ESTADO[e.estado] || [esc(e.estado), 'g'];
function vence(e){
  const hasta = e.pruebaHasta && new Date(e.pruebaHasta);
  if (e.estado === 'prueba') { if (!hasta) return ''; const d = Math.ceil((hasta - Date.now()) / DIA); return d < 0 ? `Venció el ${fecha(hasta)}` : d === 0 ? 'Vence hoy' : `Vence en ${d} ${d === 1 ? 'día' : 'días'}`; }
  if (e.estado === 'activo') return e.renuevaEl ? `${e.cancelaAlFinal ? 'Termina el' : 'Renueva'} ${fecha(e.renuevaEl)}` : '';
  if (e.estado === 'pago-pendiente') return 'Creem reintenta el cobro';
  if (e.estado === 'vencido' || e.estado === 'cancelado') { const d = e.renuevaEl || e.pruebaHasta; return d ? `Desde el ${fecha(d)}` : ''; }
  if (e.estado === 'interno') return 'Sin cobro';
  return '';
}
const COLORES = ['#2563eb', '#7c3aed', '#0d9488', '#db2777', '#ea580c', '#0891b2', '#4f46e5', '#65a30d'];
const color = id => COLORES[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORES.length];
const iniciales = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(p => p[0] || '').join('').toUpperCase() || '·';
const LOGO_OK = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/;
/** El avatar de una empresa o persona. Las iniciales van en SVG, centradas por coordenadas (regla del 31-oct). */
function avatar(nombre, id, logo, tam = 28, redondo = false){
  const r = redondo ? tam / 2 : tam <= 30 ? 8 : 11;

}

/* ── Estado ── */
const S = {soporte: null, sinEntender: null, stab: 'abierta', ssel: null, sdet: null, sq: '', sTema: '', sPri: '', borrador: {}, enviando: false, cupones: null, cq: '', cEst: '', cPlan: '', fila: null, confirma: null, nuevo: null, tab: 'resumen', rango: '12m', mes: '', resumen: null, finanzas: null, empresas: null, filtro: 'todas', plan: '', est: '', orden: 'uso', q: '', abierta: null, menu: null};

/* ── Pestañas con indicador que se desliza ── */
function moverInd(){

/* ── Pintar la página con su motion de entrada ── */
function pintar(entrar){
  const m = $('main');
  const html = S.tab === 'resumen' ? vResumen() : S.tab === 'empresas' ? vEmpresas() : S.tab === 'cupones' ? vCupones() : S.tab === 'soporte' ? vSoporte() : vFinanzas();
  if (entrar && !QUIETO) m.classList.add('pre');
  m.innerHTML = html;
  if (S.tab === 'resumen' && S.resumen) montarArea();
  if (entrar && !QUIETO) requestAnimationFrame(() => requestAnimationFrame(() => { m.classList.remove('pre'); contar(); dibujarLinea(); }));
  else { m.classList.remove('pre'); dibujarLinea(true); }
}
/** Las cifras con data-cuenta cuentan desde 0 hasta su valor (900 ms, desacelerando). */
function contar(){
  if (QUIETO) return;
  const els = [...document.querySelectorAll('[data-cuenta]')]; if (!els.length) return;
  const t0 = performance.now(), sale = x => 1 - Math.pow(1 - x, 3);
  const paso = t => {
    const p = Math.min(1, (t - t0) / 900), e = sale(p);
    for (const el of els) { const v = +el.dataset.cuenta, f = el.dataset.fmt; el.textContent = f === 'usd' ? usd(v * e, 0) : f === 'pct' ? pct(v * e, 1) : num(v * e); }
    if (p < 1) requestAnimationFrame(paso);
    else for (const el of els) el.textContent = el.dataset.final;
  };
  requestAnimationFrame(paso);
}
const cuenta = (v, fmt, txt) => `<span data-cuenta="${+v || 0}" data-fmt="${fmt}" data-final="${esc(txt)}">${esc(txt)}</span>`;

/* ═════════════ Resumen ═════════════ */
const RANGOS = [['7d', '7 d'], ['30d', '30 d'], ['12m', '12 meses'], ['todo', 'Todo']];
const VS = {'7d': 'vs. hace 7 días', '30d': 'vs. hace 30 días', '12m': 'vs. hace 12 meses', todo: 'desde el inicio'};
function vResumen(){
  const hoy = FL.format(new Date());
  const filtros = `<span class="seg" role="group" aria-label="Rango">${RANGOS.map(([k, t]) => `<button type="button" data-rango="${k}" aria-pressed="${S.rango === k}">${t}</button>`).join('')}</span><button type="button" class="btn" data-exportar="resumen">${IC.dl}Exportar</button>`;
  const cab = `<div class="cab ent"><div><h1>Resumen</h1><p class="sub">Así va Wali hoy, ${esc(hoy)}.</p></div><div class="der">${filtros}</div></div>`;

  const top = R.planes.find(p => p.mrr > 0);
  const frase = R.mrr ? [
    `${R.rango === '12m' || R.rango === 'todo' ? 'En el periodo' : 'En estos días'} entraron <b>${num(R.nuevasEnRango)} ${R.nuevasEnRango === 1 ? 'empresa' : 'empresas'}</b> y <b>${usd(R.mrrNuevo, 0)}</b> de MRR nuevo.`,
    top ? `${esc(PLAN[top.plan])} ya es el ${pct(top.mrr / R.mrr)} del ingreso.` : '',
    R.cancelacion != null && R.cancelacionAntes != null && R.cancelacion > R.cancelacionAntes ? `Ojo: la cancelación subió a ${pct(R.cancelacion, 1)}.` : '',
  ].filter(Boolean).join(' ') : 'Todavía no hay cobros: el MRR aparece con el primer pago de una empresa.';
  const kps = [
    ['ARR', cuenta(R.mrr * 12, 'usd', usd(R.mrr * 12, 0)), cambio(R.mrr, R.mrrAntes, d => R.mrrAntes ? pct(d / R.mrrAntes) : usd(d, 0))],
    ['Empresas que pagan', cuenta(R.pagan, 'n', num(R.pagan)), cambio(R.pagan, R.paganAntes, d => (d > 0 ? '+' : '') + num(d))],
    ['Pruebas que pasan a pago', R.conversion == null ? '—' : cuenta(R.conversion, 'pct', pct(R.conversion)), cambio(R.conversion, R.conversionAntes, d => num(Math.abs(d * 100)) + ' pts')],
    ['Cancelación mensual', R.cancelacion == null ? '—' : cuenta(R.cancelacion, 'pct', pct(R.cancelacion, 1)), cambio(R.cancelacion, R.cancelacionAntes, d => new Intl.NumberFormat('es-CO', {maximumFractionDigits: 1}).format(Math.abs(d * 100)) + ' pts', true)],
  ].map(([l, v, d], i) => `<div class="r-k ent" style="--d:${120 + i * 40}ms"><div class="lbl">${l}</div><div class="v"><b>${v}</b>${d}</div></div>`).join('');
  const total = R.planes.reduce((s, p) => s + p.empresas, 0);
  const planes = `<div class="ent" style="--d:280ms;padding:22px 0 0"><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px"><h3 class="h3">Planes más vendidos</h3><span class="lbl">${num(total)} ${total === 1 ? 'empresa' : 'empresas'}</span></div>
    ${R.planes.map(p => `<div style="padding:7px 0"><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px"><span style="display:flex;align-items:center;gap:7px;font-weight:600"><i style="width:10px;height:10px;border-radius:3px;background:var(--c-${p.plan})"></i>${esc(PLAN[p.plan])}</span><span><b>${num(p.empresas)}</b> <span class="mut">${p.empresas === 1 ? 'empresa' : 'empresas'} · ${usd(p.mrr, 0)}</span></span></div><div class="bar" style="margin-top:6px"><b style="width:${total ? p.empresas / total * 100 : 0}%;background:var(--c-${p.plan})"></b></div></div>`).join('')}
    <div class="lbl" style="margin-top:6px">${num(R.anuales)} de ${num(R.pagan)} pagan anual${R.anualTop ? ` · el anual más vendido es ${esc(PLAN[R.anualTop])}` : ''}</div></div>`;

    const det = a.que === 'Prueba por vencer' ? vence({estado: 'prueba', pruebaHasta: a.detalle}) : a.que === 'Cancela al final del periodo' ? (a.detalle ? `Termina el ${fecha(a.detalle)}` : '') : a.que.startsWith('Línea') ? `Desde ${hace(a.detalle).toLowerCase()}` : a.detalle;
    return `<div class="fila-at">${avatar(a.empresa, a.empresaId, a.logo)}<div><b style="font-size:13px;font-weight:600">${esc(a.empresa)}</b><div class="lbl">${esc(a.que)}${det ? ' · ' + esc(det) : ''}</div></div><span class="est ${a.nivel === 'urgente' ? 'b' : 'w'}">${IC.alert}${a.nivel === 'urgente' ? 'Urgente' : 'Revisar'}</span></div>`;
  }).join('') : '<p class="lbl" style="padding:11px 0;border-top:1px solid var(--line);margin:0">Nada pendiente. Todo en orden.</p>';
  const cb = R.cobros.length ? `<table class="t"><tbody>${R.cobros.map(c => `<tr><td class="mut">${fecha(c.fecha)}</td><td>${esc(c.empresa)}</td><td class="mut">${esc(PLAN[c.plan] || c.plan)} ${esc((PERIODO[c.periodo] || c.periodo || '').toLowerCase())}</td><td style="text-align:right;font-weight:600">${usd(c.total)}</td><td style="text-align:right">${estCobro(c.estado)}</td></tr>`).join('')}</tbody></table>` : '<p class="lbl" style="padding:11px 0;border-top:1px solid var(--line);margin:0">Todavía no hay cobros.</p>';
  return `${cab}<div class="r-top"><div class="ent" style="--d:60ms"><div class="lbl" style="font-size:13px">Ingreso mensual recurrente</div>
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="hero">${cuenta(R.mrr, 'usd', usd(R.mrr, 0))}</span>${crece == null ? '' : `<span class="dl ${crece >= 0 ? 'u' : 'd'}" style="font-size:14px">${crece >= 0 ? IC.up : IC.dn}${pct(Math.abs(crece))} ${VS[R.rango]}</span>`}</div>
    <p class="t2" style="margin:4px 0 14px;font-size:14px;max-width:640px">${frase}</p><div class="graf" id="graf-mrr"></div></div>
    <div class="r-lado">${kps}${planes}</div></div>

    <div class="ent" style="--d:240ms"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 class="h3">Últimos cobros</h3><button type="button" class="lbl" data-tab-ir="finanzas">Ver todos</button></div>${cb}</div></div>`;
}
const estCobro = e => `<span class="est ${e === 'pagado' ? 'ok' : e === 'reembolsado' ? 'g' : 'b'}">${e === 'pagado' ? 'Pagado' : e === 'reembolsado' ? 'Reembolsado' : 'Rechazado'}</span>`;

/* La gráfica de área del MRR: cuadrícula fina, relleno amarillo en degradado, línea que se dibuja y recuadro que sigue al cursor. */
const AREA = {w: 880, h: 352, pl: 56, pr: 14, pt: 14, pb: 28};
/** El tope del eje: el siguiente número redondo (1, 1,2, 1,5, 2, 2,5, 3, 4, 5, 6, 8 o 10 por potencia de 10) por encima del máximo. */
function escala(max){ const m = Math.max(max * 1.06, 1), base = Math.pow(10, Math.floor(Math.log10(m))); for (const p of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (p * base >= m) return p * base; return 10 * base; }
function montarArea(){
  const R = S.resumen, cont = $('graf-mrr'); if (!cont) return;
  const {w, h, pl, pr, pt, pb} = AREA, n = R.serie.length;
  const mx = escala(Math.max(...R.serie.map(p => p.mrr)) / 100) * 100;
  const X = i => pl + (n === 1 ? 0 : i * (w - pl - pr) / (n - 1)), Y = v => pt + (1 - v / mx) * (h - pt - pb);
  const pts = R.serie.map((p, i) => [X(i), Y(p.mrr)]);
  let largo = 0; for (let i = 1; i < pts.length; i++) largo += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);

const arriba = (x, y, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
function barrasPlan(D){
  const w = 640, h = 250, pl = 56, pr = 8, pt = 26, pb = 28, base = h - pb;
  const tot = D.porPlan.map(m => m.planes.starter + m.planes.growth + m.planes.business);
  const mx = escala(Math.max(...tot) / 100) * 100, bw = (w - pl - pr) / 12, Y = v => v / mx * (h - pt - pb);
  let g = [0, mx / 2, mx].map(v => `<line x1="${pl}" x2="${w - pr}" y1="${base - Y(v)}" y2="${base - Y(v)}" stroke="${v ? '#f0f1f4' : '#e5e7eb'}"/><text x="${pl - 10}" y="${base - Y(v) + 4}" text-anchor="end" fill="#6b7280" font-size="11">${v ? usd(v, 0) : '0'}</text>`).join('');
  D.porPlan.forEach((m, i) => {
    const x = pl + i * bw + bw * .24, ww = bw * .52; let y0 = base;
    const segs = ['starter', 'growth', 'business'].filter(p => m.planes[p] > 0);
    segs.forEach((p, k) => {
      const hh = Y(m.planes[p]), tope = k === segs.length - 1;
      g += tope ? `<path class="sube" style="--d:${i * 40}ms" d="${arriba(x, y0 - hh, ww, hh, 4)}" fill="var(--c-${p})"/>` : `<rect class="sube" style="--d:${i * 40}ms" x="${x}" y="${y0 - hh + 2}" width="${ww}" height="${Math.max(0, hh - 2)}" fill="var(--c-${p})"/>`;
      y0 -= hh;
    });
    if (i === 11 && tot[i]) g += `<text x="${x + ww / 2}" y="${y0 - 8}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b10">${usd(tot[i], 0)}</text>`;
    g += `<text x="${pl + i * bw + bw / 2}" y="${h - 8}" text-anchor="middle" font-size="11" fill="#6b7280">${MESES[+m.mes.slice(5) - 1].slice(0, 3)}</text>`;

function cascada(mov, nombre){
  const w = 500, h = 228, pl = 52, pr = 8, pt = 24, pb = 30, base = h - pb;
  const pasos = [['1 ' + nombre.slice(0, 3), mov.inicio, 'b'], ['Nuevas', mov.nuevas, '+'], ['Suben', mov.suben, '+'], ['Bajan', -mov.bajan, '-'], ['Cancelan', -mov.cancelan, '-'], ['Cierre', mov.cierre, 'b']];
  const vals = [mov.inicio, mov.cierre, mov.inicio + mov.nuevas + mov.suben];
  const top = Math.max(...vals, 1), bot = Math.min(...vals, mov.inicio - mov.bajan - mov.cancelan);
  // El eje empieza cerca del menor valor (se marca con el corte en zigzag) para que se vean los cambios pequeños.
  // Paso redondo (1, 2, 2,5 o 5 por potencia de 10) para que las marcas del eje sean números limpios.
  const redondo = x => { const b = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))); for (const k of [1, 2, 2.5, 5, 10]) if (k * b >= x) return k * b; return 10 * b; };
  const paso = redondo((top - Math.min(bot, top * .7)) / 100 / 3) * 100;
  const rangoMin = bot > top * .3 ? Math.max(0, Math.floor(bot * .95 / paso) * paso) : 0, mx = Math.ceil(top * 1.08 / paso) * paso;
  const Y = v => pt + (1 - (v - rangoMin) / (mx - rangoMin)) * (h - pt - pb), bw = (w - pl - pr) / pasos.length;
  const marcas = []; for (let v = rangoMin + paso; v <= mx + 1; v += paso) marcas.push(v);
  let g = marcas.map(v => { return `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f0f1f4"/><text x="${pl - 10}" y="${Y(v) + 4}" text-anchor="end" fill="#6b7280" font-size="11">${usd(v, 0).replace('US$ ', '')}</text>`; }).join('');
  g += `<line x1="${pl}" x2="${w - pr}" y1="${base}" y2="${base}" stroke="#e5e7eb" stroke-width="1.5"/>`;
  if (rangoMin) g += `<path d="M${pl - 14},${base - 3} l4,-4 l4,8 l4,-8 l4,4" fill="none" stroke="#6b7280" stroke-width="1.3"/>`;
  g += `<text x="${pl - 10}" y="${base + 14}" text-anchor="end" fill="#6b7280" font-size="10.5">${usd(rangoMin, 0).replace('US$ ', '')}</text>`;
  let acc = 0;
  pasos.forEach(([t, v, k], i) => {
    const x = pl + i * bw + bw * .22, ww = bw * .56; let y1, y2, c, lab;
    if (k === 'b') { y1 = Y(v); y2 = base; c = '#0b0b10'; acc = v; lab = usd(v, 0); }
    else { const a = acc, b = acc + v; y1 = Y(Math.max(a, b)); y2 = Y(Math.min(a, b)); c = v >= 0 ? 'var(--c-suma)' : 'var(--c-resta)'; acc = b; lab = (v > 0 ? '+' : v < 0 ? '−' : '') + usd(Math.abs(v), 0).replace('US$ ', ''); }
    const alto = Math.max(1, y2 - y1);
    g += `<path class="sube" style="--d:${i * 80}ms" d="${arriba(x, y2 - alto, ww, alto, 4)}" fill="${c}"/><text x="${x + ww / 2}" y="${y2 - alto - 7}" text-anchor="middle" font-size="11.5" font-weight="${k === 'b' ? 700 : 600}" fill="#0b0b10">${lab}</text><text x="${x + ww / 2}" y="${h - 9}" text-anchor="middle" font-size="11" fill="#6b7280">${t}</text>`;
    if (i < pasos.length - 1) g += `<line x1="${x + ww}" x2="${x + bw}" y1="${Y(acc)}" y2="${Y(acc)}" stroke="#6b7280" stroke-dasharray="2 3" opacity=".7"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Movimiento del MRR en ${esc(nombre)}" style="display:block;width:100%;overflow:visible">${g}</svg>`;
}

  ].map(([l, v, d, rojo], i) => `<div class="k ent" style="--d:${40 + i * 40}ms;padding:13px 16px"><div class="lbl">${l}</div><div class="big" style="font-size:24px${rojo ? ';color:var(--mal)' : ''}">${v}</div><div class="lbl">${d}</div></div>`).join('');
  const busca = `<div class="busca ent" style="--d:160ms"><label class="campo">${IC.search}<input id="sq" type="search" value="${esc(S.sq)}" placeholder="Buscar por empresa, persona o número de solicitud" aria-label="Buscar solicitud" autocomplete="off"></label>
    ${dd('stema', S.sTema ? 'Tema: ' + TEMA_SOP[S.sTema] : 'Tema: todos', [['', 'Todos los temas'], ...Object.entries(TEMA_SOP)], S.sTema)}${dd('spri', S.sPri ? 'Prioridad: ' + (S.sPri === 'urgente' ? 'urgente' : 'normal') : 'Prioridad: todas', [['', 'Todas'], ['urgente', 'Urgente'], ['normal', 'Normal']], S.sPri)}</div>`;
  const n = k => D.solicitudes.filter(s => s.estado === k).length;
  const tabs = `<div class="s-tabs ent" style="--d:180ms" role="tablist">${[...Object.entries(ESTADO_SOP).map(([k, t]) => [k, t, n(k)]), ['sin', 'El asistente no entendió', S.sinEntender ? S.sinEntender.length : null]].map(([k, t, c]) => `<button type="button" role="tab" data-stab="${k}" aria-selected="${S.stab === k}">${t}${c != null ? ` <span class="mut">${num(c)}</span>` : ''}</button>`).join('')}</div>`;
  if (S.stab === 'sin') return cab + `<div class="g4">${kps}</div>` + busca + tabs + vSinEntender();
  const fs = filtradasSop();
  if (S.ssel == null || !fs.some(s => s.id === S.ssel)) S.ssel = fs.length ? fs[0].id : null;
  const lista = fs.length ? fs.map((s, i) => `<button type="button" class="s-fila ent${S.ssel === s.id ? ' on' : ''}" style="--d:${200 + Math.min(i, 8) * 40}ms" data-ssel="${s.id}">${avatar(s.empresa, s.empresaId, s.logo)}<span class="s-fc"><span class="s-f1"><b>${esc(s.empresa)}</b><span class="lbl">${hace(s.actualizada)}</span></span><span class="s-f2">${esc(s.asunto)}</span><span class="s-f3">${chipSop(s)}<span class="lbl">${esc(s.persona)}</span>${s.nueva ? '<b class="s-nueva">Nueva</b>' : ''}</span></span></button>`).join('')
    : `<p class="lbl" style="padding:14px">${D.solicitudes.length ? 'Ninguna solicitud aquí con esos filtros.' : 'Todavía nadie ha escrito a soporte.'}</p>`;
  return cab + `<div class="g4">${kps}</div>` + busca + tabs + `<div class="s-grid"><div class="s-lista">${lista}</div><div id="s-det" class="ent" style="--d:240ms">${S.sdet && S.sdet.id === S.ssel ? vDetalleSop(S.sdet) : S.ssel ? '<div class="k vacio">Cargando…</div>' : '<div class="k vacio">Elige una solicitud.</div>'}</div></div>`;
}
const horaDe = iso => new Date(iso).toLocaleTimeString('es-CO', {hour: 'numeric', minute: '2-digit'});
function vDetalleSop(d){
  const ctx = d.contexto || {}, caidas = d.caidas || [];
  const burbuja = m => `<div class="s-msj${m.autor === 'soporte' ? ' yo' : ''}"><div class="lbl">${esc(m.nombre)}${m.autor === 'soporte' ? ' · Soporte' : ''} · ${esc(fecha(m.en))}, ${esc(horaDe(m.en))}</div><div class="s-b">${esc(m.texto)}</div></div>`;
  const pista = caidas.length ? `<div class="s-pista">${IC.alert}<span><b>Wali lo revisó solo:</b> ${caidas.map(l => `la línea ${esc(l.nombre)} está sin conexión ${esc(hace(l.desde).toLowerCase())}`).join('; ')}. Al reconectarla en Ajustes › Líneas, los mensajes de ese rato llegan solos.</span></div>` : '';
  const adj = d.adjunto && /^https:\/\/res\.cloudinary\.com\//.test(d.adjunto) ? `<a class="s-adj" href="${esc(d.adjunto)}" target="_blank" rel="noopener noreferrer">${IC.link}Ver la captura que adjuntó</a>` : '';
  const [et, ec] = estado({estado: d.empresa.estado, cancelaAlFinal: d.empresa.cancelaAlFinal});
  const filas = [['Empresa', esc(d.empresa.nombre)], ['Plan', esc(`${PLAN[d.empresa.plan] || d.empresa.plan} ${(PERIODO[d.empresa.periodo] || '').toLowerCase()}`.trim())], ['Estado', `<span class="est ${ec}">${et}</span>`], ['Rol', esc(ROL[d.persona.rol] || d.persona.rol)], ['Estaba en', esc(ctx.pantalla || '—')],
    ...caidas.map(l => [`Línea ${esc(l.nombre)}`, `<span style="color:var(--mal)">Sin conexión ${esc(hace(l.desde).toLowerCase())}</span>`]),
    ['Buscó antes', (ctx.busco || []).length ? ctx.busco.map(b => `«${esc(b)}»`).join(', ') : '—']];
  const resuelta = d.estado === 'resuelta';
  const botones = resuelta ? `<button type="button" class="btn" data-sest="abierta">Reabrir</button>`
    : `<button type="button" class="btn" data-sest="${d.estado === 'en_curso' ? 'abierta' : 'en_curso'}" aria-pressed="${d.estado === 'en_curso'}">${IC.reloj}${d.estado === 'en_curso' ? 'En curso' : 'Marcar en curso'}</button><button type="button" class="btn" data-sest="resuelta">${IC.chulo}Resolver</button>`;
  return `<div class="k s-det"><div class="s-hilo"><div class="s-hcab"><div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:center">${chipSop(d)}<span class="lbl">#${esc(d.numero)} · ${esc(hace(d.creada).toLowerCase())}</span></div><h3 class="h3" style="font-size:16px;margin-top:6px">${esc(d.asunto)}</h3></div>${botones}</div>
    <div class="s-msjs">${d.mensajes.map(burbuja).join('')}${adj}${pista}</div>
    <form class="s-resp" id="s-resp"><textarea id="s-texto" rows="3" maxlength="4000" placeholder="Escribe la respuesta…" aria-label="Respuesta">${esc(S.borrador[d.id] || '')}</textarea>
      <div class="s-rpie"><span class="lbl" style="display:flex;gap:6px;align-items:center">${IC.correo}Le llega por correo y en el asistente de Wali</span><button type="submit" class="btn pri"${S.enviando ? ' disabled' : ''}>${IC.avion}${S.enviando ? 'Enviando…' : 'Responder'}</button></div></form></div>
    <div class="s-ctx"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${avatar(d.persona.nombre, d.persona.correo, null, 36, true)}<div style="min-width:0"><b style="font-size:13.5px">${esc(d.persona.nombre)}</b><div class="lbl">${esc(d.persona.correo)}</div></div></div>
      ${filas.map(([a, b]) => `<div class="s-cf"><span class="mut">${a}</span><span>${b}</span></div>`).join('')}
      ${d.antes.length ? `<div class="lbl" style="margin-top:14px">Antes pidió</div>${d.antes.map(a => `<div class="t2" style="font-size:12.5px;margin-top:4px">«${esc(a.asunto)}» · ${a.minutos != null ? `resuelta en ${esc(hm(a.minutos))}` : esc((ESTADO_SOP[a.estado] || a.estado).toLowerCase())} · ${esc(fecha(a.creada))}</div>`).join('')}` : ''}
      <button type="button" class="btn" style="width:100%;justify-content:center;margin-top:14px" data-sempresa="${esc(d.empresa.id)}">${IC.empresa}Ver empresa</button></div></div>`;
}
function vSinEntender(){
  const L = S.sinEntender;
  if (!L) return '<div class="vacio">Cargando…</div>';
  const q = norm(S.sq), fs = L.filter(p => !q || norm(`${p.q} ${p.empresa}`).includes(q));
  return fs.length ? `<div class="k tw ent" style="--d:200ms;padding:2px 6px"><table class="t"><thead><tr><th>Lo que preguntaron</th><th>Empresa</th><th>Cuándo</th></tr></thead><tbody>${fs.map(p => `<tr><td style="white-space:normal">«${esc(p.q)}»</td><td class="mut">${esc(p.empresa)}</td><td class="mut">${esc(hace(p.en))}</td></tr>`).join('')}</tbody></table></div><p class="lbl" style="margin-top:10px">Sirven para escribir guías nuevas en el asistente.</p>`
    : '<div class="k vacio ent" style="--d:200ms">Nada por aquí: el asistente entendió todo.</div>';
}
function pintarDetalle(){ const c = $('s-det'); if (!c || !S.sdet) return; c.replaceChildren(); c.insertAdjacentHTML('beforeend', vDetalleSop(S.sdet)); const h = c.querySelector('.s-msjs'); if (h) h.scrollTop = h.scrollHeight; }
async function abrirSol(id){
  S.ssel = id; S.sdet = null; pintar(false);
  try { const d = await api('/soporte/' + id); if (S.ssel === id) { S.sdet = d; pintarDetalle(); } }
  catch (err) { const c = $('s-det'); if (c) { c.replaceChildren(); c.insertAdjacentHTML('beforeend', `<div class="k vacio">${esc(err.message)}</div>`); } }
}
async function responderSol(){
  const t = $('s-texto'), id = S.ssel; if (!t || !id || S.enviando) return;
  const texto = t.value.trim(); if (texto.length < 2) { alertar('Escribe la respuesta'); return; }
  S.enviando = true; S.borrador[id] = texto; pintarDetalle();
  try { await api(`/soporte/${id}/responder`, 'POST', {texto}); delete S.borrador[id]; alertar('Respuesta enviada'); }
  catch (err) { alertar(err.message); }
  S.enviando = false; await recargarSoporte();
}
async function estadoSol(estado){
  const id = S.ssel; if (!id) return;
  try { await api(`/soporte/${id}/estado`, 'POST', {estado}); alertar(estado === 'resuelta' ? 'Solicitud resuelta' : estado === 'en_curso' ? 'Marcada en curso' : 'Solicitud abierta otra vez'); S.stab = estado; await recargarSoporte(); }
  catch (err) { alertar(err.message); }
}
async function recargarSoporte(){
  S.soporte = await api('/soporte'); badgeSoporte();
  if (S.tab === 'soporte') { pintar(false); if (S.ssel) abrirSol(S.ssel); }
}
function badgeSoporte(){
  const b = document.querySelector('.tab[data-tab="soporte"] .tab-n'), n = S.soporte ? S.soporte.solicitudes.filter(s => s.espera).length : 0;
  if (b) { b.textContent = n; b.hidden = !n; }
  moverInd();
}
function eventoSoporte(t){
  const tb = t.closest('[data-stab]');
  if (tb) {
    S.stab = tb.dataset.stab; S.ssel = null; S.sdet = null;
    if (S.stab === 'sin' && !S.sinEntender) api('/soporte/sin-entender').then(l => { S.sinEntender = l; pintar(false); }, e => alertar(e.message));
    pintar(false);
    if (S.stab !== 'sin') { const f = filtradasSop()[0]; if (f) abrirSol(f.id); }
    return true;
  }
  const se = t.closest('[data-ssel]'); if (se) { const id = +se.dataset.ssel; if (id !== S.ssel || !S.sdet) abrirSol(id); return true; }
  const es = t.closest('[data-sest]'); if (es) { estadoSol(es.dataset.sest); return true; }
  const em = t.closest('[data-sempresa]'); if (em) { const id = em.dataset.sempresa; irA('empresas'); (S.empresas ? Promise.resolve() : cargar('empresas')).then(() => abrirEmpresa(id)); return true; }
  return false;
}

/* ── Exportar (CSV en el navegador, con lo que ya está cargado) ── */
function csv(nombre, filas){
  const txt = '﻿' + filas.map(f => f.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'})); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function exportar(que){
  if (que === 'empresas') csv('empresas-wali.csv', [['Empresa', 'Correo', 'Plan', 'Periodo', 'Estado', 'Usuarios', 'Líneas', 'Líneas caídas', 'Conversaciones 30 d', 'Último uso', 'Alta'], ...filtradas().map(e => [e.nombre, e.correo, PLAN[e.plan] || e.plan, e.periodo || '', estado(e)[0], e.usuarios, e.lineas, e.caidas, e.conv30, e.ultimoUso || '', e.alta])]);
  if (que === 'resumen' && S.resumen) csv(`mrr-wali-${S.rango}.csv`, [['Fecha', 'MRR (USD)'], ...S.resumen.serie.map(p => [p.t.slice(0, 10), (p.mrr / 100).toFixed(2)])]);
  if (que === 'cobros') { const c = await api('/cobros'); csv('cobros-wali.csv', [['Recibo', 'Fecha', 'Empresa', 'Plan', 'Periodo', 'Estado', 'Total (USD)'], ...c.map(p => ['NX-' + p.numero, p.fecha.slice(0, 10), p.empresa, PLAN[p.plan] || p.plan, p.periodo, p.estado, (p.total / 100).toFixed(2)])]); }
}

/* ── Cargar datos ── */
async function cargar(que){
  try {
    if (que === 'resumen') S.resumen = await api('/resumen?rango=' + S.rango);
    if (que === 'empresas') S.empresas = await api('/empresas');
    if (que === 'finanzas') { S.finanzas = await api('/finanzas' + (S.mes ? '?mes=' + S.mes : '')); }
    if (que === 'cupones') S.cupones = await api('/cupones');
    if (que === 'soporte') { S.soporte = await api('/soporte'); badgeSoporte(); }
    if (S.tab === que) { pintar(true); if (que === 'soporte' && S.ssel) abrirSol(S.ssel); }
  } catch (err) { if (S.tab === que) $('main').innerHTML = `<div class="vacio">${esc(err.message)}</div>`; }
}

/* ── Eventos ── */
document.addEventListener('click', ev => {
  const t = ev.target instanceof Element ? ev.target : null; if (!t) return;
  const tab = t.closest('[data-tab]'); if (tab) { if (tab.dataset.tab !== S.tab) { irA(tab.dataset.tab); if (!S[tab.dataset.tab]) cargar(tab.dataset.tab); } return; }
  const ir = t.closest('[data-tab-ir]'); if (ir) { irA(ir.dataset.tabIr); if (!S[ir.dataset.tabIr]) cargar(ir.dataset.tabIr); return; }
  const rg = t.closest('[data-rango]'); if (rg) { if (rg.dataset.rango !== S.rango) { S.rango = rg.dataset.rango; cargar('resumen'); } return; }
  if (S.tab === 'cupones' && eventoCupones(t)) return;
  if (S.tab === 'soporte' && eventoSoporte(t)) return;
  const ex = t.closest('[data-exportar]'); if (ex) { exportar(ex.dataset.exportar).catch(e => alertar(e.message)); return; }
  const d = t.closest('[data-dd]'); if (d) { S.menu = S.menu === d.dataset.dd ? null : d.dataset.dd; pintar(false); return; }
  const op = t.closest('[data-op]');
  if (op) {
    const [id, ...r] = op.dataset.op.split(':'), v = r.join(':'); S.menu = null;
    if (id === 'plan') S.plan = v; if (id === 'est') S.est = v; if (id === 'orden') S.orden = v; if (id === 'cest') S.cEst = v; if (id === 'cplan') S.cPlan = v; if (id === 'stema') { S.sTema = v; S.ssel = null; } if (id === 'spri') { S.sPri = v; S.ssel = null; }
    if (id === 'mes') { S.mes = v; cargar('finanzas'); return; }
    pintar(false); return;
  }
  if (S.menu && !t.closest('.dd')) { S.menu = null; pintar(false); }
  const k = t.closest('[data-kp]'); if (k) { S.filtro = k.dataset.kp; pintar(false); return; }
  if (t.closest('#pn-x')) { cerrarPanel(); return; }
  const tr = t.closest('tr[data-emp]'); if (tr) { S.abierta === tr.dataset.emp ? cerrarPanel() : abrirEmpresa(tr.dataset.emp); return; }
  if (S.abierta && !t.closest('#pn')) cerrarPanel();
  if (S.nuevo && !t.closest('#pn') && !t.closest('[data-c-nuevo]')) cerrarNuevo();
});
document.addEventListener('mousemove', tipBarras);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (S.nuevo && S.menu) { S.menu = null; pintarNuevo(); } else if (S.menu || S.fila) { S.menu = null; S.fila = null; S.confirma = null; pintar(false); } else if (S.nuevo) cerrarNuevo(); else cerrarPanel(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target instanceof Element && ev.target.matches('tr[data-emp]')) { ev.preventDefault(); abrirEmpresa(ev.target.dataset.emp); }
});
document.addEventListener('input', ev => {
  if (ev.target.closest && ev.target.closest('#fm-cupon')) { leerNuevo(); return; }
  if (ev.target.id === 's-texto') { if (S.ssel) S.borrador[S.ssel] = ev.target.value; return; }
  if (ev.target.id === 'sq') { S.sq = ev.target.value; const pos = ev.target.selectionStart; pintar(false); const q = $('sq'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {} if (S.ssel && S.stab !== 'sin') abrirSol(S.ssel); return; }
  if (ev.target.id === 'cq') { S.cq = ev.target.value; const pos = ev.target.selectionStart; pintar(false); const q = $('cq'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {} return; }
  if (ev.target.id !== 'q') return;
  S.q = ev.target.value; const pos = ev.target.selectionStart; pintar(false);
  const q = $('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {}
});
function alertar(t){ const el = $('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(alertar.t); alertar.t = setTimeout(() => el.classList.remove('ver'), 3200); }
document.addEventListener('submit', ev => { if (ev.target.id === 's-resp') { ev.preventDefault(); responderSol(); } });
$('salir').addEventListener('click', async () => {
  try { await fetch('__BASE__/api/auth/logout', {method: 'POST', credentials: 'same-origin', headers: {Authorization: 'Bearer ' + await token()}}); } catch {}
  location.href = '__BASE__/entrar';
});
addEventListener('resize', () => { moverInd(); if (S.tab === 'resumen' && S.resumen) montarArea(), dibujarLinea(true); });

/* ── Arranque ── */
(() => {
  const h = location.hash.slice(1);
  if (['resumen', 'empresas', 'finanzas', 'cupones', 'soporte'].includes(h)) S.tab = h;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  document.fonts.ready.then(moverInd); moverInd();
  pintar(false); cargar(S.tab);
  if (S.tab !== 'soporte') api('/soporte').then(d => { S.soporte = d; badgeSoporte(); }, () => {});
  setInterval(() => { if (document.visibilityState === 'visible' && S.tab !== 'soporte') api('/soporte').then(d => { S.soporte = d; badgeSoporte(); }, () => {}); }, 60_000);
})();
</script>
</body>
</html>
