<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Superadministrador · Wali</title>
<link rel="icon" type="image/png" sizes="32x32" href="__BASE__/img/wali-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Panel de superadministrador (maqueta B «Editorial» aprobada el 31-oct en «Maquetas Wali»): pestañas centradas arriba,
   Resumen, Empresas y Finanzas. Solo datos de uso y de cobros: nunca contactos ni mensajes de las empresas.
   Todo lo que viene del API pasa por esc() antes de pintarse; el logo solo se usa si es un data URL de imagen válido.
   Motion (motion-design): curva principal (.2,0,0,1), entrada (.05,.7,.1,1), salida (.3,0,1,1); 120/240/480 ms;
   la gráfica se dibuja en 900 ms; escalonado de 40 ms. Con «reducir movimiento» todo queda quieto. */
:root{--ink:#0b0b10;--t2:#4b5563;--t3:#6b7280;--line:#e9ebef;--grid:#f0f1f4;--bg:#fff;--amar:#FFD21F;--ok:#15803d;--mal:#b91c1c;
  --e-std:cubic-bezier(.2,0,0,1);--e-in:cubic-bezier(.05,.7,.1,1);--e-out:cubic-bezier(.3,0,1,1);
  --c-starter:#2a78d6;--c-growth:#eb6834;--c-business:#1baf7a;--c-suma:#1baf7a;--c-resta:#e34948}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{height:60px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:0 32px;position:sticky;top:0;z-index:20;background:#fff}
.marca{display:flex;align-items:center;gap:9px;font-weight:700;line-height:1}
.marca img{width:28px;height:28px;border-radius:8px;display:block}
.marca b{font-size:15px;line-height:1}
.tag{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;margin-left:4px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;font-weight:600;line-height:1;color:var(--t3)}
.tabs{position:relative;display:flex}
.tab{display:inline-flex;align-items:center;gap:7px;height:59px;padding:0 15px;font-size:13.5px;font-weight:500;color:var(--t3);transition:color 120ms var(--e-std)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.ind{position:absolute;bottom:-1px;left:0;width:1px;height:2px;background:var(--ink);transform-origin:0 0;transition:transform 240ms var(--e-std)}
.yo{justify-self:end;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t2)}
.yo button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.yo button:hover{background:#f6f7f9;color:var(--ink)}
main{max-width:none;margin:0;padding:30px 40px 70px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.sub{margin:3px 0 0;font-size:13px;color:var(--t3)}
.der{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;white-space:nowrap;transition:background 160ms cubic-bezier(.23,1,.32,1),border-color 160ms cubic-bezier(.23,1,.32,1),color 160ms cubic-bezier(.23,1,.32,1),transform 140ms cubic-bezier(.23,1,.32,1)}
.btn:active:not(:disabled){transform:scale(.97);transition-duration:90ms}
.sx-seg button,.sx-facc button,.sx-facc a,.sx-fx,.sx-clip,.sx-fx2{transition:background 160ms cubic-bezier(.23,1,.32,1),color 160ms cubic-bezier(.23,1,.32,1),transform 140ms cubic-bezier(.23,1,.32,1)}
.sx-seg button:active,.sx-fx:active,.sx-fx2:active{transform:scale(.95)}
.btn:hover{background:#f6f7f9}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff}
.seg button{padding:4px 11px;border-radius:7px;font-size:12.5px;color:var(--t2);transition:background 120ms var(--e-std),color 120ms var(--e-std)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.lbl{font-size:12.5px;color:var(--t3)}
.mut{color:var(--t3)}.t2{color:var(--t2)}
.dl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;white-space:nowrap}
.dl.u{color:var(--ok)}.dl.d{color:var(--mal)}.dl.n{color:var(--t3)}
.dl svg{width:13px;height:13px;stroke-width:2.2}
.h3{font-size:14.5px;font-weight:650;margin:0}
.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.big{font-size:28px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.2}
.est{display:inline-flex;align-items:center;justify-content:center;line-height:1;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.est svg{width:12px;height:12px;stroke-width:2.2}
.est.ok{background:#e8f8ee;color:#15803d}.est.w{background:#fff8e1;color:#7a5a00}.est.b{background:#fee2e2;color:#b91c1c}.est.g{background:#f1f5f9;color:#4b5563}.est.p{background:#eef2ff;color:#4338ca}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;font-weight:500;color:var(--t3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.bar{height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;transform-origin:left;transition:transform 480ms var(--e-in) 260ms}
.vacio{padding:36px 16px;text-align:center;color:var(--t3)}
.av{flex:none;display:block}
/* Resumen */
.r-top{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px}
.hero{font-size:52px;font-weight:750;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.r-lado{border-left:1px solid var(--line);padding-left:28px}
.r-k{padding:14px 0;border-bottom:1px solid var(--line)}
.r-k .v{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.r-k .v b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.r-bajo{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:26px}
.fila-at{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.fila-at > div{flex:1;min-width:0}
.graf{position:relative}
.graf svg{display:block;width:100%;overflow:visible}
.cross{position:absolute;top:0;left:0;width:0;border-left:1px dashed #9ca3af;pointer-events:none;transition:transform 120ms var(--e-std),opacity 120ms var(--e-std)}
.punto{position:absolute;left:0;top:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px #fff;pointer-events:none;transition:transform 120ms var(--e-std),opacity 120ms var(--e-std)}
.tip{position:absolute;left:0;top:0;min-width:150px;padding:8px 12px;border-radius:9px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px -12px rgba(15,23,42,.3);font-size:11.5px;color:var(--t3);pointer-events:none;white-space:nowrap;transition:transform 120ms var(--e-std),opacity 120ms var(--e-std)}
.tip b{display:block;font-size:13px;color:var(--ink)}
.tip .tl{display:flex;justify-content:space-between;gap:14px;font-size:11.5px}
.tip .tl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.ley{display:flex;gap:14px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.ley span{display:inline-flex;align-items:center;gap:6px}
.ley i{width:10px;height:10px;border-radius:3px}
/* Empresas */
.kp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kp button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;text-align:left;transition:border-color 120ms var(--e-std),box-shadow 120ms var(--e-std)}
.kp button:hover{border-color:#cbd5e1}
.kp button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.kp b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.busca{display:flex;gap:8px;margin-bottom:14px}
.campo{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--t3);background:#fff}
.campo:focus-within{border-color:var(--ink)}
.campo input{border:0;outline:0;font:inherit;font-size:13.5px;color:var(--ink);flex:1;min-width:0;background:none}
.dd{position:relative}
.dd > .btn{height:40px}
.dd > .btn[aria-expanded="true"]{border-color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 36px -16px rgba(15,23,42,.35);padding:5px;transform-origin:top right;animation:abre 160ms var(--e-in)}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left}
.menu button:hover{background:#f6f7f9}
.menu button[aria-checked="true"]{font-weight:600}
@keyframes abre{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
tbody tr[data-emp]{cursor:pointer;transition:background 120ms var(--e-std)}
tbody tr[data-emp]:hover{background:#fafbfc}
tbody tr[data-emp].on{background:#fffbe0}
tbody tr[data-emp]:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.emp{display:flex;align-items:center;gap:10px}
.emp b{font-weight:600}
.pn{position:fixed;top:60px;right:0;bottom:0;width:min(500px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-30px 0 60px -40px rgba(0,0,0,.45);padding:22px 24px 40px;overflow-y:auto;z-index:18;transform:translateX(100%);transition:transform 240ms var(--e-out)}
.pn.in{transform:none;transition:transform 340ms var(--e-in)}
.pn-h{display:flex;gap:12px;align-items:center}
.pn-h h2{margin:0;font-size:18px;font-weight:650}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#dc2626;margin-left:auto;flex:none}
.x:hover{background:#fef2f2}
.cif{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.cif div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cif b{display:block;font-size:14.5px;margin-top:2px}
.sec{font-size:12.5px;font-weight:600;color:var(--t3);margin:20px 0 4px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f3f4f6;font-size:13px}
.sec + .row{border-top:0}
.row > div{flex:1;min-width:0}
.row > div b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row > div .lbl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Finanzas */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.g2a{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pyg{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pyg.tot{font-weight:700;font-size:15px}
/* Cupones */
.btn.pri{background:var(--amar);border-color:var(--amar);color:#0b0b10;font-weight:600}
.btn.pri:hover{background:#f5c800}
.btn:disabled{opacity:.55;cursor:default}
.cod{display:inline-flex;align-items:center;justify-content:center;line-height:1;height:24px;padding:0 8px;border-radius:6px;background:#f4f5f7;border:1px dashed var(--line);font-size:12.5px;font-weight:600}
.mas{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.mas:hover{background:#f6f7f9}
tr.borrando td{transition:opacity 240ms var(--e-out),padding 240ms var(--e-out);opacity:0;padding-top:0;padding-bottom:0}
.fm{display:grid;gap:16px;margin-top:18px}
.fm label,.fm .lb{display:grid;gap:6px;font-size:12.5px;font-weight:600}
.fm input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;outline:0;transition:border-color 120ms var(--e-std)}
.fm input:focus{border-color:var(--ink)}
.fm small{font-weight:400;color:var(--t3);font-size:12px}
.fm .dd > .btn{width:100%;justify-content:space-between}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.ancho{display:flex;width:100%}.seg.ancho button{flex:1;text-align:center;padding:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:500;transition:background 120ms var(--e-std),color 120ms var(--e-std)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.prev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--t2)}
.err{color:var(--mal);font-size:12.5px;margin:0}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 240ms var(--e-in),transform 240ms var(--e-in);z-index:40}
#toast.ver{opacity:1;transform:translate(-50%,0)}
/* Soporte */
.tab-n{min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#e34948;color:#fff;font-size:11px;font-weight:700;line-height:normal;display:grid;place-items:center}
.tab-n[hidden]{display:none}
/* Motion de entrada: cada página arranca con .pre y al quitarla cada pieza llega a su lugar. */
.ent{transition:opacity 240ms var(--e-in) var(--d,0ms),transform 240ms var(--e-in) var(--d,0ms)}
.pre .ent{opacity:0;transform:translateY(10px);transition:none}
.pre .bar b{transform:scaleX(0);transition:none}
.sube{transform-box:fill-box;transform-origin:50% 100%;transition:transform 480ms var(--e-in) calc(var(--d,0ms) + 120ms)}
.pre .sube{transform:scaleY(0);transition:none}
.traza{transition:stroke-dashoffset 900ms var(--e-std) 120ms}
.area{transition:opacity 480ms var(--e-std) 620ms}
.pre .area{opacity:0;transition:none}
@media (max-width:1100px){.r-top{grid-template-columns:1fr}.r-lado{border-left:0;padding-left:0}.g2a,.g2b,.r-bajo{grid-template-columns:1fr}}
@media (max-width:960px){.kp{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:22px 16px 60px}.top{padding:0 16px;grid-template-columns:auto 1fr auto}.tabs{overflow-x:auto;justify-self:center;max-width:100%}.tab{padding:0 10px}.yo span{display:none}.tag{display:none}}
@media (max-width:768px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.busca{flex-wrap:wrap}.campo{flex-basis:100%}.hero{font-size:40px}}
/* ── Soporte como la bandeja del CRM (maqueta aprobada el 10-nov) ── */
main.sop{max-width:none;margin:0;padding:10px;height:100%;display:flex}
.sx{flex:1;min-height:0;display:grid;grid-template-columns:var(--wb-lista) minmax(0,1fr);gap:10px}
.sx-det{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--wb-ficha);gap:10px;position:relative}
.sx-panel{background:#fff;border-radius:16px;box-shadow:0 0 0 1px #eef0f3;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sx-vacio{padding:24px;text-align:center;color:var(--t3);font-size:13px;margin:auto}
.sx-lh{padding:16px 16px 12px;display:grid;gap:12px;border-bottom:1px solid #eef0f3}
.sx-lt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sx-lt h2{margin:0 auto 0 0;font-size:17px;font-weight:700}
.sx-q{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--t3)}
.sx-lh{grid-template-columns:minmax(0,1fr)}.sx-lh > *{min-width:0}
.sx-fq{display:flex;gap:8px;align-items:center}.sx-fq .sx-q{flex:1;min-width:0}
.sx-filt{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--ink);flex:none;transition:background 160ms var(--e-std),border-color 160ms var(--e-std),transform 140ms var(--e-std)}
.sx-filt:hover{background:#f3f6fa}.sx-filt:active{transform:scale(.96)}.sx-filt svg.i{width:16px;height:16px}.sx-filt.activo,.sx-filt.abierto{border-color:#0b0b10}.sx-filt.abierto{background:#f3f6fa}
.sx-filt .fn{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#FFD21F;color:#0b0b10;font-size:11px;font-weight:700;display:grid;place-items:center;animation:sx-pop 300ms var(--e-in) both}
.sx-fmenu{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -12px rgba(15,23,42,.25);padding:6px;display:grid;gap:2px;transform-origin:top right;animation:sx-menu 200ms var(--e-in) both}
@keyframes sx-menu{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.sx-fmenu .hd{font-size:11.5px;color:#9ca3af;padding:6px 10px 4px}
.sx-fmenu button[role="menuitemcheckbox"]{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;width:100%;color:var(--ink)}
.sx-fmenu button[role="menuitemcheckbox"]:hover{background:#f3f6fa}
.sx-fmenu .chk{width:17px;height:17px;border-radius:5px;border:1.5px solid #b6c0d0;display:inline-grid;place-items:center;background:#fff;flex:none;margin-right:2px;transition:background 160ms,border-color 160ms}
.sx-fmenu .chk.on{background:#0b0b10;border-color:#0b0b10;color:#fff}.sx-fmenu .chk svg.i{width:11px;height:11px;stroke-width:2.6}
.sx-fmenu .fpie{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #eef0f3;margin-top:4px;padding:8px 4px 2px}
.sx-fmenu .lim{font-size:13px;color:var(--t2);padding:6px 8px;border-radius:8px}.sx-fmenu .lim:hover{background:#f3f6fa}.sx-fmenu .btn.pri{height:34px;padding:0 14px}
@media (prefers-reduced-motion:reduce){.sx-fmenu,.sx-filt .fn{animation:none}}
.sx-q input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:13.5px;color:var(--ink);background:none}.sx-q:focus-within{border-color:var(--ink)}
.sx-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:#f4f5f7}
.sx-seg button{height:34px;border-radius:9px;font-size:12.5px;padding:0 4px;white-space:nowrap;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:5px;transition:background 200ms var(--e-std),color 200ms var(--e-std),transform 140ms var(--e-std)}
.sx-seg button:active{transform:scale(.96)}.sx-seg button[aria-selected="true"]{background:#0b0b10;color:#fff;font-weight:600}
.sx-seg em{font-style:normal;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;box-sizing:border-box;background:#fff;color:var(--t2);padding:0 5px;font-weight:600}.sx-seg button[aria-selected="true"] em{background:#2a2a33;color:#fff}
.sx-items{flex:1;overflow-y:auto;padding:8px;display:grid;align-content:start;gap:8px}
.sx-it{display:block;width:100%;text-align:left;border-radius:14px;border:1px solid transparent;overflow:hidden;transition:background 180ms var(--e-std),border-color 180ms var(--e-std),transform 140ms var(--e-std);animation:sx-entra 320ms var(--e-in) var(--d,0ms) both}

function escala(max){ const m = Math.max(max * 1.06, 1), base = Math.pow(10, Math.floor(Math.log10(m))); for (const p of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (p * base >= m) return p * base; return 10 * base; }
function montarArea(){
  const R = S.resumen, cont = $('graf-mrr'); if (!cont) return;
  const {w, h, pl, pr, pt, pb} = AREA, n = R.serie.length;
  const mx = escala(Math.max(...R.serie.map(p => p.mrr)) / 100) * 100;
  const X = i => pl + (n === 1 ? 0 : i * (w - pl - pr) / (n - 1)), Y = v => pt + (1 - v / mx) * (h - pt - pb);
  const pts = R.serie.map((p, i) => [X(i), Y(p.mrr)]);
  let largo = 0; for (let i = 1; i < pts.length; i++) largo += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const linea = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = `M${X(0)},${Y(0)} L${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L')} L${X(n - 1)},${Y(0)} Z`;
  const ticks = [0, mx / 2, mx].map(v => `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? '#e9ebef' : '#e5e7eb'}"/><text x="${pl - 10}" y="${Y(v) + 4}" text-anchor="end" fill="#6b7280" font-size="11">${v ? usd(v, 0) : '0'}</text>`).join('');
  const diario = S.rango === '7d' || S.rango === '30d', cada = Math.max(1, Math.ceil(n / 12));
  const etq = R.serie.map((p, i) => (i % cada && i !== n - 1) ? '' : `<text x="${X(i)}" y="${h - 8}" text-anchor="middle" fill="#6b7280" font-size="11">${diario ? fecha(p.t) : mesCorto(p.t)}</text>`).join('');
  cont.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="MRR en el rango elegido"><defs><linearGradient id="mrr-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD21F" stop-opacity=".45"/><stop offset=".65" stop-color="#FFD21F" stop-opacity=".14"/><stop offset="1" stop-color="#FFD21F" stop-opacity="0"/></linearGradient><pattern id="mrr-c" width="12" height="12" patternUnits="userSpaceOnUse" x="${pl}" y="${pt}"><path d="M12 0H0V12" fill="none" stroke="#f0f1f4"/></pattern></defs>
    <rect x="${pl}" y="${pt}" width="${w - pl - pr}" height="${h - pt - pb}" fill="url(#mrr-c)"/>${ticks}
    <path class="area" d="${area}" fill="url(#mrr-a)"/><polyline class="traza" points="${linea}" fill="none" stroke="#0b0b10" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:${Math.ceil(largo) + 4};stroke-dashoffset:${Math.ceil(largo) + 4}"/>${etq}</svg>
    <span class="cross" style="opacity:0"></span><span class="punto" style="opacity:0"></span><div class="tip" style="opacity:0"></div>`;
  const svg = cont.querySelector('svg'), cross = cont.querySelector('.cross'), punto = cont.querySelector('.punto'), tip = cont.querySelector('.tip');
  const mostrar = i => {
    const r = svg.getBoundingClientRect(), k = r.width / w, x = X(i) * k, y = Y(R.serie[i].mrr) * k;
    mover(cross, `transform:translate(${x}px,${pt * k}px);height:${(h - pt - pb) * k}px;opacity:1`);
    mover(punto, `transform:translate(${x}px,${y}px);opacity:1`);
    tip.innerHTML = `${diario ? FL.format(new Date(R.serie[i].t)) : mesLargo(R.serie[i].t.slice(0, 7))}<b>${usd(R.serie[i].mrr, 0)} MRR</b>`;
    const derecha = x > r.width - 180;
    mover(tip, `transform:translate(${derecha ? x - 166 : x + 14}px,${Math.max(0, y - 62)}px);opacity:1`);
  };
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * w;
    let i = Math.round((xv - pl) / ((w - pl - pr) / Math.max(1, n - 1))); i = Math.max(0, Math.min(n - 1, i)); mostrar(i);
  });
  svg.addEventListener('mouseleave', () => { cross.style.opacity = punto.style.opacity = tip.style.opacity = '0'; });
}

const arriba = (x, y, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
function barrasPlan(D){
  const w = 640, h = 250, pl = 56, pr = 8, pt = 26, pb = 28, base = h - pb;
  const tot = D.porPlan.map(m => m.planes.starter + m.planes.growth + m.planes.business);
  const mx = escala(Math.max(...tot) / 100) * 100, bw = (w - pl - pr) / 12, Y = v => v / mx * (h - pt - pb);
  let g = [0, mx / 2, mx].map(v => `<line x1="${pl}" x2="${w - pr}" y1="${base - Y(v)}" y2="${base - Y(v)}" stroke="${v ? '#f0f1f4' : '#e5e7eb'}"/><text x="${pl - 10}" y="${base - Y(v) + 4}" text-anchor="end" fill="#6b7280" font-size="11">${v ? usd(v, 0) : '0'}</text>`).join('');
  D.porPlan.forEach((m, i) => {
    const x = pl + i * bw + bw * .24, ww = bw * .52; let y0 = base;
    const segs = ['starter', 'growth', 'business'].filter(p => m.planes[p] > 0);
    segs.forEach((p, k) => {
      const hh = Y(m.planes[p]), tope = k === segs.length - 1;
      g += tope ? `<path class="sube" style="--d:${i * 40}ms" d="${arriba(x, y0 - hh, ww, hh, 4)}" fill="var(--c-${p})"/>` : `<rect class="sube" style="--d:${i * 40}ms" x="${x}" y="${y0 - hh + 2}" width="${ww}" height="${Math.max(0, hh - 2)}" fill="var(--c-${p})"/>`;
      y0 -= hh;
    });
    if (i === 11 && tot[i]) g += `<text x="${x + ww / 2}" y="${y0 - 8}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b10">${usd(tot[i], 0)}</text>`;

function cascada(mov, nombre){
  const w = 500, h = 228, pl = 52, pr = 8, pt = 24, pb = 30, base = h - pb;
  const pasos = [['1 ' + nombre.slice(0, 3), mov.inicio, 'b'], ['Nuevas', mov.nuevas, '+'], ['Suben', mov.suben, '+'], ['Bajan', -mov.bajan, '-'], ['Cancelan', -mov.cancelan, '-'], ['Cierre', mov.cierre, 'b']];
  const vals = [mov.inicio, mov.cierre, mov.inicio + mov.nuevas + mov.suben];
  const top = Math.max(...vals, 1), bot = Math.min(...vals, mov.inicio - mov.bajan - mov.cancelan);
  // El eje empieza cerca del menor valor (se marca con el corte en zigzag) para que se vean los cambios pequeños.
  // Paso redondo (1, 2, 2,5 o 5 por potencia de 10) para que las marcas del eje sean números limpios.
  const redondo = x => { const b = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))); for (const k of [1, 2, 2.5, 5, 10]) if (k * b >= x) return k * b; return 10 * b; };
  const paso = redondo((top - Math.min(bot, top * .7)) / 100 / 3) * 100;
  const rangoMin = bot > top * .3 ? Math.max(0, Math.floor(bot * .95 / paso) * paso) : 0, mx = Math.ceil(top * 1.08 / paso) * paso;
  const Y = v => pt + (1 - (v - rangoMin) / (mx - rangoMin)) * (h - pt - pb), bw = (w - pl - pr) / pasos.length;
  const marcas = []; for (let v = rangoMin + paso; v <= mx + 1; v += paso) marcas.push(v);
  let g = marcas.map(v => { return `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f0f1f4"/><text x="${pl - 10}" y="${Y(v) + 4}" text-anchor="end" fill="#6b7280" font-size="11">${usd(v, 0).replace('US$ ', '')}</text>`; }).join('');
  g += `<line x1="${pl}" x2="${w - pr}" y1="${base}" y2="${base}" stroke="#e5e7eb" stroke-width="1.5"/>`;
  if (rangoMin) g += `<path d="M${pl - 14},${base - 3} l4,-4 l4,8 l4,-8 l4,4" fill="none" stroke="#6b7280" stroke-width="1.3"/>`;
  g += `<text x="${pl - 10}" y="${base + 14}" text-anchor="end" fill="#6b7280" font-size="10.5">${usd(rangoMin, 0).replace('US$ ', '')}</text>`;
  let acc = 0;
  pasos.forEach(([t, v, k], i) => {
    const x = pl + i * bw + bw * .22, ww = bw * .56; let y1, y2, c, lab;
    if (k === 'b') { y1 = Y(v); y2 = base; c = '#0b0b10'; acc = v; lab = usd(v, 0); }
    else { const a = acc, b = acc + v; y1 = Y(Math.max(a, b)); y2 = Y(Math.min(a, b)); c = v >= 0 ? 'var(--c-suma)' : 'var(--c-resta)'; acc = b; lab = (v > 0 ? '+' : v < 0 ? '−' : '') + usd(Math.abs(v), 0).replace('US$ ', ''); }
    const alto = Math.max(1, y2 - y1);
    g += `<path class="sube" style="--d:${i * 80}ms" d="${arriba(x, y2 - alto, ww, alto, 4)}" fill="${c}"/><text x="${x + ww / 2}" y="${y2 - alto - 7}" text-anchor="middle" font-size="11.5" font-weight="${k === 'b' ? 700 : 600}" fill="#0b0b10">${lab}</text><text x="${x + ww / 2}" y="${h - 9}" text-anchor="middle" font-size="11" fill="#6b7280">${t}</text>`;
    if (i < pasos.length - 1) g += `<line x1="${x + ww}" x2="${x + bw}" y1="${Y(acc)}" y2="${Y(acc)}" stroke="#6b7280" stroke-dasharray="2 3" opacity=".7"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Movimiento del MRR en ${esc(nombre)}" style="display:block;width:100%;overflow:visible">${g}</svg>`;
}

  S.enviando = true; d.mensajes.push(m); delete S.borrador[id]; delete S.adj[id];

  const hilo = document.querySelector('.sx-msgs'); let el = null;
  if (hilo) { hilo.insertAdjacentHTML('beforeend', burbujaSop(m, d)); el = hilo.lastElementChild; hilo.scrollTo({top: hilo.scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
  try { await api(`/soporte/${id}/responder`, 'POST', {texto, archivos}); }
  catch (err) {
    // No salió: se quita la burbuja y el texto y los archivos vuelven al cuadro.
    S.enviando = false; const k = d.mensajes.indexOf(m); if (k >= 0) d.mensajes.splice(k, 1); if (el) el.remove();
    if (S.ssel === id) { const t2 = $('s-texto'); if (t2 && !t2.value) t2.value = texto; S.borrador[id] = texto; S.adj[id] = L; pintarAdj(); }
    alertar(err.message); return;
  }
  S.enviando = false;
  // Por detrás: la lista y los conteos al día, y el hilo con los datos del servidor, sin tocar el chat abierto.
  try { S.soporte = await api('/soporte'); badgeSoporte(); if (S.tab === 'soporte') pintarListaSop(); } catch {}
  try { const nd = await api('/soporte/' + id); if (S.ssel === id) S.sdet = nd; } catch {}
}
// Solo la columna de la lista: el chat y lo que se está escribiendo quedan como están.
function pintarListaSop(){
  if (S.filtroAb) requestAnimationFrame(pintarMenuFiltro);
  const vieja = document.querySelector('.sx-lista'); if (!vieja) return;
  // vSoporte elige otra solicitud si la abierta salió de la pestaña; aquí no: el chat abierto se queda.
  const sel = S.ssel, tmp = document.createElement('div'); tmp.insertAdjacentHTML('beforeend', vSoporte()); S.ssel = sel;
  const nueva = tmp.querySelector('.sx-lista'); if (!nueva) return;
  const sc = vieja.querySelector('.sx-items'), y = sc ? sc.scrollTop : 0;
  nueva.querySelectorAll('.sx-it').forEach(x => { x.style.animation = 'none'; });
  vieja.replaceWith(nueva); const sc2 = nueva.querySelector('.sx-items'); if (sc2) sc2.scrollTop = y;
}
async function estadoSol(estado){
  const id = S.ssel; if (!id) return;
  try { await api(`/soporte/${id}/estado`, 'POST', {estado}); alertar(estado === 'resuelta' ? 'Solicitud resuelta' : estado === 'en_curso' ? 'Marcada en curso' : 'Solicitud abierta otra vez'); S.stab = estado; await recargarSoporte(); }
  catch (err) { alertar(err.message); }
}
async function recargarSoporte(){
  S.soporte = await api('/soporte'); badgeSoporte();
  if (S.tab !== 'soporte') return;
  pintar(false);
  const id = S.ssel; if (id) api('/soporte/' + id).then(nd => { if (S.ssel === id) { S.sdet = nd; pintarDetalle(); } }, () => {});
}
function badgeSoporte(){
  const b = document.querySelector('.tab[data-tab="soporte"] .tab-n'), n = S.soporte ? S.soporte.solicitudes.filter(s => s.espera).length : 0;
  if (b) { b.textContent = n; b.hidden = !n; }
  moverInd();
}
function eventoSoporte(t){
  const tb = t.closest('[data-stab]');
  if (tb) {
    S.stab = tb.dataset.stab; S.ssel = null; S.sdet = null;
    pintar(false);
    const f = filtradasSop()[0]; if (f) abrirSol(f.id);
    return true;
  }
  const se = t.closest('[data-ssel]'); if (se) { const id = +se.dataset.ssel; S.sficha = false; WB.cajon(document.querySelector('.zona'), false); S.svista = 'chat'; if (id !== S.ssel || !S.sdet) abrirSol(id); else pintar(false); return true; }
  // En el celular se ve una parte a la vez (lista, chat o ficha); en pantallas medianas la ficha se abre encima.
  const sv = t.closest('[data-svolver]'); if (sv) { S.svista = sv.dataset.svolver; S.sficha = false; pintar(false); return true; }
  const sf = t.closest('[data-sficha]'); if (sf) { if (sf.dataset.sficha === '1' && !WB.esCajon() && !window.matchMedia('(max-width:760px)').matches) return true;
    WB.cajon(document.querySelector('.zona'), sf.dataset.sficha === '1' && WB.esCajon(), () => { S.sficha = false; S.svista = 'chat'; });
    S.sficha = sf.dataset.sficha === '1'; S.svista = S.sficha ? 'ficha' : 'chat'; const sx = document.querySelector('.sx'); if (sx) sx.dataset.v = S.svista; const det = $('s-det'); if (det) det.classList.toggle('ficha-abierta', S.sficha); return true; }
  const fb = t.closest('[data-sfilt]'); if (fb) { S.filtroAb = !S.filtroAb; fb.classList.toggle('abierto', S.filtroAb); fb.setAttribute('aria-expanded', String(S.filtroAb)); pintarMenuFiltro(); return true; }
  const tf = t.closest('[data-stfi]'); if (tf) { S.smin = tf.dataset.stfi === '1'; WB.ocultarFicha($('s-det'), S.smin); return true; }
  if (t.closest('[data-sclip]')) { const f = $('s-file'); if (f) f.click(); return true; }
  const sq = t.closest('[data-squitar]'); if (sq) { const L = S.adj[S.ssel] || []; L.splice(+sq.dataset.squitar, 1); pintarAdj(); return true; }
  const sc = t.closest('[data-scopiar]'); if (sc) { navigator.clipboard.writeText(sc.dataset.scopiar).then(() => alertar('Correo copiado'), () => alertar('No se pudo copiar')); return true; }
  const es = t.closest('[data-sest]'); if (es) { estadoSol(es.dataset.sest); return true; }
  const em = t.closest('[data-sempresa]'); if (em) { const id = em.dataset.sempresa; irA('empresas'); (S.empresas ? Promise.resolve() : cargar('empresas')).then(() => abrirEmpresa(id)); return true; }
  return false;
}

/* ── Exportar (CSV en el navegador, con lo que ya está cargado) ── */
function csv(nombre, filas){
  const txt = '﻿' + filas.map(f => f.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'})); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function exportar(que){
  if (que === 'empresas') csv('empresas-wali.csv', [['Empresa', 'Correo', 'Plan', 'Periodo', 'Estado', 'Usuarios', 'Líneas', 'Líneas caídas', 'Conversaciones 30 d', 'Último uso', 'Alta'], ...filtradas().map(e => [e.nombre, e.correo, planDe(e), e.periodo || '', estado(e)[0], e.usuarios, e.lineas, e.caidas, e.conv30, e.ultimoUso || '', e.alta])]);
  if (que === 'resumen' && S.resumen) csv(`mrr-wali-${S.rango}.csv`, [['Fecha', 'MRR (USD)'], ...S.resumen.serie.map(p => [p.t.slice(0, 10), (p.mrr / 100).toFixed(2)])]);
  if (que === 'cobros') { const c = await api('/cobros'); csv('cobros-wali.csv', [['Recibo', 'Fecha', 'Empresa', 'Plan', 'Periodo', 'Estado', 'Total (USD)'], ...c.map(p => ['NX-' + p.numero, p.fecha.slice(0, 10), p.empresa, PLAN[p.plan] || p.plan, p.periodo, p.estado, (p.total / 100).toFixed(2)])]); }
}

/* ── Cargar datos ── */
async function cargar(que){
  try {
    if (que === 'resumen') S.resumen = await api('/resumen?rango=' + S.rango);
    if (que === 'empresas') S.empresas = await api('/empresas');
    if (que === 'finanzas') { S.finanzas = await api('/finanzas' + (S.mes ? '?mes=' + S.mes : '')); }
    if (que === 'cupones') S.cupones = await api('/cupones');
    if (que === 'soporte' || que === 'analiticas') { S.soporte = await api('/soporte'); badgeSoporte(); if (que === 'analiticas') S.analiticas = true; }
    if (S.tab === que) { pintar(true); if (que === 'soporte' && S.ssel) abrirSol(S.ssel); }
  } catch (err) { if (S.tab === que) $('main').innerHTML = `<div class="vacio">${esc(err.message)}</div>`; }
}

/* ── Eventos ── */
document.addEventListener('click', ev => {
  const t = ev.target instanceof Element ? ev.target : null; if (!t) return;
  const tab = t.closest('[data-tab]'); if (tab) { if (tab.dataset.tab !== S.tab) { irA(tab.dataset.tab); if (!S[tab.dataset.tab]) cargar(tab.dataset.tab); } return; }
  const ir = t.closest('[data-tab-ir]'); if (ir) { irA(ir.dataset.tabIr); if (!S[ir.dataset.tabIr]) cargar(ir.dataset.tabIr); return; }
  const rg = t.closest('[data-rango]'); if (rg) { if (rg.dataset.rango !== S.rango) { S.rango = rg.dataset.rango; cargar('resumen'); } return; }
  if (S.tab === 'cupones' && eventoCupones(t)) return;
  if (S.tab === 'soporte' && eventoSoporte(t)) return;
  const ex = t.closest('[data-exportar]'); if (ex) { exportar(ex.dataset.exportar).catch(e => alertar(e.message)); return; }
  const d = t.closest('[data-dd]'); if (d) { S.menu = S.menu === d.dataset.dd ? null : d.dataset.dd; pintar(false); return; }
  const op = t.closest('[data-op]');
  if (op) {
    const [id, ...r] = op.dataset.op.split(':'), v = r.join(':'); S.menu = null;
    if (id === 'plan') S.plan = v; if (id === 'est') S.est = v; if (id === 'orden') S.orden = v; if (id === 'cest') S.cEst = v; if (id === 'cplan') S.cPlan = v;
    if (id === 'mes') { S.mes = v; cargar('finanzas'); return; }
    pintar(false); return;
  }
  if (S.menu && !t.closest('.dd')) { S.menu = null; pintar(false); }
  const k = t.closest('[data-kp]'); if (k) { S.filtro = k.dataset.kp; pintar(false); return; }
  if (t.closest('#pn-x')) { cerrarPanel(); return; }
  const tr = t.closest('tr[data-emp]'); if (tr) { S.abierta === tr.dataset.emp ? cerrarPanel() : abrirEmpresa(tr.dataset.emp); return; }
  if (S.abierta && !t.closest('#pn')) cerrarPanel();
  if (S.nuevo && !t.closest('#pn') && !t.closest('[data-c-nuevo]')) cerrarNuevo();
});
document.addEventListener('mousemove', tipBarras);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.filtroAb) { cerrarFiltro(); return; }
  if (ev.key === 'Escape' && $('lat').classList.contains('abierta')) { menu(false); return; }
  if (ev.key === 'Escape') { if (S.nuevo && S.menu) { S.menu = null; pintarNuevo(); } else if (S.menu || S.fila) { S.menu = null; S.fila = null; S.confirma = null; pintar(false); } else if (S.nuevo) cerrarNuevo(); else cerrarPanel(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target instanceof Element && ev.target.matches('tr[data-emp]')) { ev.preventDefault(); abrirEmpresa(ev.target.dataset.emp); }
});
document.addEventListener('input', ev => {
  if (ev.target.closest && ev.target.closest('#fm-cupon')) { leerNuevo(); return; }
  if (ev.target.id === 's-texto') { if (S.ssel) S.borrador[S.ssel] = ev.target.value; return; }
  if (ev.target.id === 'sq') { S.sq = ev.target.value; const pos = ev.target.selectionStart; pintar(false); const q = $('sq'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {} if (S.ssel) abrirSol(S.ssel); return; }
  if (ev.target.id === 'cq') { S.cq = ev.target.value; const pos = ev.target.selectionStart; pintar(false); const q = $('cq'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {} return; }
  if (ev.target.id !== 'q') return;
  S.q = ev.target.value; const pos = ev.target.selectionStart; pintar(false);
  const q = $('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {}
});
function alertar(t){ const el = $('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(alertar.t); alertar.t = setTimeout(() => el.classList.remove('ver'), 3200); }
document.addEventListener('change', ev => { if (ev.target.id === 's-file' && ev.target.files.length) { const fs = [...ev.target.files]; ev.target.value = ''; subirAdj(fs); } });
document.addEventListener('paste', ev => {
  if (ev.target.id !== 's-texto' || !ev.clipboardData) return;
  const fs = [...ev.clipboardData.files]; if (!fs.length) return;
  ev.preventDefault(); subirAdj(fs);
});
document.addEventListener('submit', ev => { if (ev.target.id === 's-resp') { ev.preventDefault(); responderSol(); } });
$('menu').addEventListener('click', () => menu(true));
// Barra plegable (compartido/bandeja.js): el botón va donde decía «Superadmin».
$('lat-plg').outerHTML = WB.botonPlegar('id="lat-plegar"');
$('lat-plegar').addEventListener('click', () => WB.plegarBarra($('lat'), !$('lat').classList.contains('wb-plegada')));
WB.plegarBarra($('lat'), WB.barraPlegada(), false);
$('lat-x').addEventListener('click', () => menu(false));
$('lat-velo').addEventListener('click', () => menu(false));
$('salir').addEventListener('click', async () => {
  try { await fetch('__BASE__/api/auth/logout', {method: 'POST', credentials: 'same-origin', headers: {Authorization: 'Bearer ' + await token()}}); } catch {}
  location.href = '__BASE__/entrar';
});
addEventListener('resize', () => { moverInd(); if (S.tab === 'resumen' && S.resumen) montarArea(), dibujarLinea(true); });

/* ── Arranque ── */
(() => {
  const h = location.hash.slice(1);
  if (['resumen', 'analiticas', 'empresas', 'finanzas', 'cupones', 'soporte'].includes(h)) S.tab = h;
  $('yo-av').textContent = iniciales(INI.yo.nombre || INI.yo.email || ''); $('mtop-t').textContent = NOMBRE_MOD[S.tab] || '';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  document.fonts.ready.then(moverInd); moverInd();
  pintar(false); cargar(S.tab);
  if (S.tab !== 'soporte') api('/soporte').then(d => { S.soporte = d; badgeSoporte(); }, () => {});
  setInterval(() => { if (document.visibilityState === 'visible' && S.tab !== 'soporte') api('/soporte').then(d => { S.soporte = d; badgeSoporte(); }, () => {}); }, 60_000);
})();
</script>
